<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lチカ ブロックシミュレーター</title>
  <style>
    :root {
      --panel-bg: #0a192f;
      --main-blue: #00e5ff;
      --main-blue-hover: #00b3cc;
      --bg-workspace: #112240;
      --text-main: #e6f1ff;
      --text-muted: #8892b0;
      --border-color: #1d3557;
      
      /* ブロックの色（Scratch風） */
      --block-action: #4c97ff; /* 動き・見た目 */
      --block-ctrl: #ffab19;   /* 制御（待つ） */
      --block-shadow: rgba(0, 0, 0, 0.4);
    }
    
    body {
      margin: 0; padding: 20px;
      background-color: transparent; /* 背景透明 */
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    
    .simulator-container {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 229, 255, 0.1);
    }
    
    h2 {
      margin: 0 0 20px 0; color: var(--main-blue); text-align: center;
      border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
    }
    
    ruby { font-size: 1.1em; }
    rt { font-size: 0.6em; color: var(--text-muted); }

    .desc {
      font-size: 14px; color: var(--text-muted);
      text-align: center; margin-bottom: 20px;
    }

    .workspace {
      display: flex; gap: 20px; margin-bottom: 20px;
      flex-direction: column;
    }
    @media (min-width: 600px) {
      .workspace { flex-direction: row; }
    }

    .panel {
      flex: 1; background: var(--bg-workspace);
      border: 1px solid var(--border-color); border-radius: 8px;
      padding: 15px; min-height: 250px;
    }
    
    h3 { margin: 0 0 15px 0; font-size: 16px; color: #fff; text-align: center; }

    /* ブロックのデザイン */
    .block {
      padding: 12px 15px; margin-bottom: 6px;
      border-radius: 4px; color: white; font-weight: bold;
      font-size: 15px; cursor: pointer; user-select: none;
      box-shadow: 0 4px 0 var(--block-shadow);
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
    }
    .block:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--block-shadow);
    }
    .block.action { background: var(--block-action); border: 1px solid #3373cc; }
    .block.ctrl { background: var(--block-ctrl); border: 1px solid #cf8b17; }
    
    /* パレット側（左）のブロックはホバー効果をつける */
    .palette .block:hover { filter: brightness(1.1); }
    
    /* プログラム側（右）のブロックが連結しているように見せる */
    .program-area .block { margin-bottom: 2px; box-shadow: none; border-radius: 2px; }
    .program-area .block:first-child { border-top-left-radius: 4px; border-top-right-radius: 4px; }
    .program-area .block:last-child { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; box-shadow: 0 4px 0 var(--block-shadow); }
    
    .hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 15px; }

    /* ボタンと結果 */
    .btn-check {
      width: 100%; background: var(--main-blue); color: #000;
      border: none; padding: 15px; border-radius: 8px;
      font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0 #0099aa; transition: all 0.1s;
      margin-bottom: 15px;
    }
    .btn-check:active {
      transform: translateY(4px); box-shadow: 0 0 0 #0099aa;
    }

    .result {
      text-align: center; font-size: 16px; font-weight: bold;
      min-height: 50px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; padding: 10px;
    }
    .result.success { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--main-blue); color: var(--main-blue); }
    .result.error { background: rgba(255, 51, 68, 0.1); border: 1px solid #ff3344; color: #ff3344; }
  </style>
</head>
<body>

  <div class="simulator-container">
    <h2>Lチカの<ruby>命令<rt>めいれい</rt></ruby>を組み立てよう！</h2>
    <div class="desc">
      左のブロックをクリックして、右のエリアに「LEDがチカチカ<ruby>点滅<rt>てんめつ</rt></ruby>する」プログラムを作ろう！
    </div>

    <div class="workspace">
      <!-- 使えるブロック（パレット） -->
      <div class="panel palette">
        <h3>使えるブロック</h3>
        <div class="block action" onclick="addBlock('on')">LED(2)を(ON)にする</div>
        <div class="block action" onclick="addBlock('off')">LED(2)を(OFF)にする</div>
        <div class="block ctrl" onclick="addBlock('wait')">(1)秒 待つ</div>
      </div>

      <!-- 組み立てエリア -->
      <div class="panel program-area">
        <h3>キミのプログラム</h3>
        <div id="blocks-container">
          <!-- 追加されたブロックがここに入ります -->
        </div>
        <div class="hint">💡 いらないブロックはクリックすると消せるよ</div>
      </div>
    </div>

    <button class="btn-check" onclick="checkAnswer()">プログラムをテストする！</button>
    
    <div id="result-message" class="result">
      ブロックを並べてテストボタンを押してね。
    </div>
  </div>

  <script>
    // プログラムを保存する配列
    let program = [];

    // ブロックを追加する関数
    function addBlock(type) {
      if(program.length >= 4) {
        alert("ブロックは4つまでだよ！いらないブロックをクリックして消そう。");
        return;
      }
      program.push(type);
      renderBlocks();
      resetMessage();
    }

    // ブロックを削除する関数
    function removeBlock(index) {
      program.splice(index, 1);
      renderBlocks();
      resetMessage();
    }

    // 画面にブロックを描画する関数
    function renderBlocks() {
      const container = document.getElementById('blocks-container');
      container.innerHTML = ''; // 一度全部消す

      program.forEach((type, index) => {
        const div = document.createElement('div');
        
        if (type === 'on') {
          div.className = 'block action';
          div.innerText = 'LED(2)を(ON)にする';
        } else if (type === 'off') {
          div.className = 'block action';
          div.innerText = 'LED(2)を(OFF)にする';
        } else if (type === 'wait') {
          div.className = 'block ctrl';
          div.innerText = '(1)秒 待つ';
        }
        
        // クリックで削除
        div.onclick = () => removeBlock(index);
        container.appendChild(div);
      });
    }

    // メッセージをリセット
    function resetMessage() {
      const msg = document.getElementById('result-message');
      msg.className = 'result';
      msg.innerHTML = 'ブロックを並べてテストボタンを押してね。';
    }

    // 正誤判定をする関数
    function checkAnswer() {
      const msg = document.getElementById('result-message');
      
      // ブロックが4つ未満の場合
      if (program.length < 4) {
        msg.className = 'result error';
        msg.innerHTML = '❌ ブロックが足りないみたい！全部で4つのブロックを組み合わせてね。';
        return;
      }

      // 正解のパターン：「ON」→「待つ」→「OFF」→「待つ」
      const isCorrect = (program[0] === 'on' && program[1] === 'wait' && program[2] === 'off' && program[3] === 'wait');
      // ※実は「OFF」→「待つ」→「ON」→「待つ」でも点滅はするが、今回は基本の形を正解とする
      const isCorrectReverse = (program[0] === 'off' && program[1] === 'wait' && program[2] === 'on' && program[3] === 'wait');

      if (isCorrect || isCorrectReverse) {
        msg.className = 'result success';
        msg.innerHTML = '🎉 大正解！光って、待って、消えて、待つ。完璧なプログラムだ！';
      } else {
        msg.className = 'result error';
        msg.innerHTML = '❌ 順番（じゅんばん）が違うみたいだ…。「光る」→「待つ」→「消える」→「待つ」の順に並べてみよう！';
      }
    }
  </script>
</body>
</html>
