<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi 操縦ロジックシミュレーター</title>
  <style>
    :root {
      --panel-bg: #050a0f;
      --main-green: #00ff41;
      --bg-workspace: #0a1118;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --border-color: #1a2c3f;
      
      /* ブロックの色 */
      --block-ctrl: #ffab19;   /* もし〜なら (制御) */
      --block-action: #4c97ff; /* 動かす (アクション) */
      --block-shadow: rgba(0, 0, 0, 0.4);
    }
    
    body {
      margin: 0; padding: 20px;
      background-color: transparent;
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    
    .simulator-container {
      background: var(--panel-bg);
      border: 1px solid var(--main-green);
      border-radius: 12px;
      padding: 30px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }
    
    h2 {
      margin: 0 0 20px 0; color: var(--main-green); text-align: center;
      border-bottom: 1px dashed var(--main-green); padding-bottom: 10px;
    }

    .desc {
      font-size: 14px; color: var(--text-muted);
      text-align: center; margin-bottom: 20px;
    }

    .workspace {
      display: flex; gap: 20px; margin-bottom: 20px;
      flex-direction: column;
    }
    @media (min-width: 600px) {
      .workspace { flex-direction: row; }
    }

    .panel {
      flex: 1; background: var(--bg-workspace);
      border: 1px solid var(--border-color); border-radius: 8px;
      padding: 15px; min-height: 250px;
    }
    
    h3 { margin: 0 0 15px 0; font-size: 16px; color: #fff; text-align: center; }

    .block {
      padding: 12px 15px; margin-bottom: 6px;
      border-radius: 4px; color: white; font-weight: bold;
      font-size: 14px; cursor: pointer; user-select: none;
      box-shadow: 0 4px 0 var(--block-shadow);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .block:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--block-shadow);
    }
    .block.action { background: var(--block-action); border: 1px solid #3373cc; }
    .block.ctrl { background: var(--block-ctrl); border: 1px solid #cf8b17; }
    
    .palette .block:hover { filter: brightness(1.1); }
    
    .program-area .block { margin-bottom: 2px; box-shadow: none; border-radius: 2px; }
    .program-area .block:first-child { border-top-left-radius: 4px; border-top-right-radius: 4px; }
    .program-area .block:last-child { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; box-shadow: 0 4px 0 var(--block-shadow); }
    
    .hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 15px; }

    .btn-check {
      width: 100%; background: var(--main-green); color: #000;
      border: none; padding: 15px; border-radius: 8px;
      font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0 #00cc33; transition: all 0.1s;
      margin-bottom: 15px;
    }
    .btn-check:active {
      transform: translateY(4px); box-shadow: 0 0 0 #00cc33;
    }

    .result {
      text-align: center; font-size: 15px; font-weight: bold;
      min-height: 50px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; padding: 10px;
    }
    .result.success { background: rgba(0, 255, 65, 0.1); border: 1px solid var(--main-green); color: var(--main-green); }
    .result.error { background: rgba(255, 51, 68, 0.1); border: 1px solid #ff3344; color: #ff3344; }
  </style>
</head>
<body>

  <div class="simulator-container">
    <h2>操縦ロジックを組み立てよう！</h2>
    <div class="desc">
      左のブロックをクリックして、スマホからの文字を仕分けるルールを作ろう！
    </div>

    <div class="workspace">
      <!-- 使えるブロック（パレット） -->
      <div class="panel palette">
        <h3>使えるブロック</h3>
        <div class="block ctrl" onclick="addBlock('if_fwd')">もし【FORWARD】を受け取ったら</div>
        <div class="block ctrl" onclick="addBlock('if_stop')">もし【STOP】を受け取ったら</div>
        <div class="block action" onclick="addBlock('act_fwd')">モーターを回す（前進）</div>
        <div class="block action" onclick="addBlock('act_stop')">モーターを止める（停止）</div>
      </div>

      <!-- 組み立てエリア -->
      <div class="panel program-area">
        <h3>キミのプログラム</h3>
        <div id="blocks-container"></div>
        <div class="hint">💡 いらないブロックはクリックすると消せるよ</div>
      </div>
    </div>

    <button class="btn-check" onclick="checkAnswer()">ルールをテストする！</button>
    
    <div id="result-message" class="result">
      ブロックを並べてテストボタンを押してね。
    </div>
  </div>

  <script>
    let program = [];

    const blockData = {
      'if_fwd': { class: 'ctrl', text: 'もし【FORWARD】を受け取ったら' },
      'if_stop': { class: 'ctrl', text: 'もし【STOP】を受け取ったら' },
      'act_fwd': { class: 'action', text: 'モーターを回す（前進）' },
      'act_stop': { class: 'action', text: 'モーターを止める（停止）' }
    };

    function addBlock(type) {
      if(program.length >= 4) {
        alert("ブロックは4つまでだよ！いらないブロックをクリックして消そう。");
        return;
      }
      program.push(type);
      renderBlocks();
      resetMessage();
    }

    function removeBlock(index) {
      program.splice(index, 1);
      renderBlocks();
      resetMessage();
    }

    function renderBlocks() {
      const container = document.getElementById('blocks-container');
      container.innerHTML = ''; 
      program.forEach((type, index) => {
        const div = document.createElement('div');
        div.className = 'block ' + blockData[type].class;
        div.innerText = blockData[type].text;
        div.onclick = () => removeBlock(index);
        container.appendChild(div);
      });
    }

    function resetMessage() {
      const msg = document.getElementById('result-message');
      msg.className = 'result';
      msg.innerHTML = 'ブロックを並べてテストボタンを押してね。';
    }

    function checkAnswer() {
      const msg = document.getElementById('result-message');
      
      if (program.length < 4) {
        msg.className = 'result error';
        msg.innerHTML = '❌ ブロックが足りないよ！全部で4つ組み合わせてね。';
        return;
      }

      // 正解パターン1: FORWARD処理 -> STOP処理
      const p1 = (program[0] === 'if_fwd' && program[1] === 'act_fwd' && program[2] === 'if_stop' && program[3] === 'act_stop');
      // 正解パターン2: STOP処理 -> FORWARD処理
      const p2 = (program[0] === 'if_stop' && program[1] === 'act_stop' && program[2] === 'if_fwd' && program[3] === 'act_fwd');

      if (p1 || p2) {
        msg.className = 'result success';
        msg.innerHTML = '🎉 大正解！文字を見分けて正しくモーターを動かせるぞ！';
      } else {
        msg.className = 'result error';
        msg.innerHTML = '❌ 条件（もし〜なら）のすぐ下に、正しい動きをくっつけてみよう！';
      }
    }
  </script>
</body>
</html>
